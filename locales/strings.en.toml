[prune]
# scripts/prune.sh [help text, one block]
help = '''
prune.sh - Find (and optionally delete) bites/<branch> output branches whose source branch no
longer exists. Use it for output branches orphaned before the cleanup job existed, or when a
delete event was missed. Without --delete it only lists them.

usage: scripts/prune.sh [--delete] [--ssh] [--url URL] OWNER/REPO

  --delete   delete the orphaned output branches instead of only listing them
  --ssh      talk to GitHub over SSH instead of HTTPS
  --url URL  use this repository URL instead (used by the tests)
  -h, --help show this text

An orphaned bites output branch is one whose source branch no longer exists, such as bites/feature-x
when feature-x has been deleted.
Exit Status: 0: Success, no orphans found; non-zero: Bad arguments or git errors.
'''

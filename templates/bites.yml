# .github/workflows/bites.yml
#
# TEMPLATE for the caller workflow. scripts/bootstrap.sh copies it into a project and fills
# in the two placeholders on the `uses:` lines below: the repository that holds the actions
# (default imdebating/bites) and the version (default v1). Until then it is not a valid
# workflow.
#
# Thin caller. All of the work is done by the shared actions; this file only decides WHEN
# to run and WHAT the jobs may do. Do not edit the steps. To change the version, change the
# ref after @ (a moving major tag such as v1, an exact tag, or a full commit SHA), or
# re-run the bootstrap script with --ref.
#
# Optional settings go under `with:` next to `full`: max-chars, read-cap, include and
# exclude (see the README). They override a bites.toml in the project. Give them to the
# bootstrap script as --set KEY=VALUE, so that running it again keeps them.
#
# Two jobs:
#   bites    on every push (and by hand): mirror large files and apply patch files.
#   cleanup  when a branch is deleted: delete that branch's bites/<branch> mirror.
#
# Opt-in per branch: nothing is mirrored unless a branch named bites/<branch> exists.
# A push-triggered run uses the copy of this file in the pushed commit, so a branch must
# contain this file (create branches after it is on the default branch, or merge the
# default branch into older ones). A delete-triggered run always uses the copy on the
# DEFAULT branch, so the cleanup job needs the file on the default branch only.
name: bites

on:
  # Every branch except the output branches themselves (prevents loops).
  push:
    branches-ignore: ['bites/**']
  # Fires when a branch or tag is deleted (including by "Automatically delete head
  # branches" after a pull request is merged).
  delete:
  # Manual run from the Actions tab, on whichever branch is selected.
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild and re-split every large file instead of only changed ones
        type: boolean
        default: false

# Push to <branch> (applied patches), to bites/<branch> (parts) and delete bites/<branch>
# (cleanup). Nothing else.
permissions:
  contents: write

jobs:
  bites:
    if: github.event_name != 'delete'
    runs-on: ubuntu-24.04
    # One run at a time per branch, queued rather than cancelled, so a rebuild is never
    # interrupted half way through writing parts.
    concurrency:
      group: bites-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: __ACTION__@__REF__
        with:
          full: ${{ inputs.full || false }}
__SETTINGS__

  cleanup:
    # Branch deletions only, and never for the output branches themselves. (A delete
    # event's github.ref is the default branch, so the group below uses the deleted name.)
    if: github.event_name == 'delete' && github.event.ref_type == 'branch' && !startsWith(github.event.ref, 'bites/')
    runs-on: ubuntu-24.04
    concurrency:
      group: bites-cleanup-${{ github.event.ref }}
      cancel-in-progress: false
    steps:
      - uses: __ACTION__/cleanup@__REF__

# cleanup/action.yml - composite action: delete bites/<branch> after <branch> is deleted
#
# Used from the caller workflow's `cleanup` job (see templates/bites.yml):
#     - uses: imdebating/bites/cleanup@v1
#       with:
#         dry-run: false       # optional; 'true' only reports what it would delete
#
# Runs on the `delete` event. All the decisions are in scripts/cleanup.sh (which has its own
# tests): it deletes bites/<branch> only when the event is a branch deletion, the branch is
# not the default branch and not itself a bites/* branch, the source branch has not been
# re-created in the meantime, and the mirror exists.
#
# The calling job must grant `permissions: contents: write`.
name: bites cleanup
description: Delete the bites/<branch> mirror branch when its source branch is deleted.
author: imdebating

inputs:
  dry-run:
    description: "'true' reports what would be deleted without deleting it"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # A delete event runs on the default branch. The checkout is only there to give git a
    # repository, with credentials, to push the deletion from.
    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1

    # github.action_path is the directory that holds this action.yml, that is cleanup/ in
    # the action repository, so the script is one level up in scripts/.
    - name: Delete the mirror branch
      shell: bash
      env:
        BRANCH: ${{ github.event.ref }}
        REF_TYPE: ${{ github.event.ref_type }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        DRY_RUN: ${{ inputs.dry-run }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        script="$ACTION_PATH/../scripts/cleanup.sh"
        if [ ! -f "$script" ]; then
          echo "cleanup.sh not found at $script (action path: $ACTION_PATH)" >&2
          exit 1
        fi
        exec bash "$script"
